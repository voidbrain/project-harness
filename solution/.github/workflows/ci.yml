name: CI

# Coordinator-owned checks only. Component availability and integration jobs need deliberate provisioning.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Optional source-owned records and explicit tasks
        # Before every step that reads docs/BACKLOG.md: with workItems.views "built" it writes the fresh ledger (F-096).
        run: |
          if test -f tools/work-items.mjs; then
            node tools/work-items.mjs check
          fi
      - name: Which backlog views
        id: views
        run: echo "built=$(node -p "const w = require('./.harness.json').workItems; Boolean(w?.enabled && w.views === 'built')")" >> "$GITHUB_OUTPUT"
      - name: Built backlog views, attached to the run (F-096)
        if: steps.views.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backlog-views
          path: docs/BACKLOG.md
          if-no-files-found: error
          retention-days: 30
      - name: Coordinator backlog and archive integrity
        run: node tools/check-backlog.mjs
      - name: Optional MCP recommendation metadata
        run: node tools/mcp.mjs check

      - name: Optional backlog dependency validation
        run: |
          if test -f tools/backlog-dependencies.mjs; then
            node tools/backlog-dependencies.mjs --check
          fi

      - name: Optional backlog work-queue validation
        run: |
          if test -f tools/backlog-queue.mjs; then
            node tools/backlog-queue.mjs --check
          fi
