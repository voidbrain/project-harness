name: CI

# Coordinator-owned checks only. Component availability and integration jobs need deliberate provisioning.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coordinator backlog and archive integrity
        run: node tools/check-backlog.mjs
      - name: Optional MCP recommendation metadata
        run: node tools/mcp.mjs check
