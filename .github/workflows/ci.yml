name: CI

# Every pull request: this repository's own harness checks (AGENTS, Checks before you finish).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for check-harness, history for check-freshness

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Template consistency
        run: npm run check:template

      - name: Copied tools against fixtures
        run: npm run test:tools

      - name: Optional integration recommendation metadata
        run: npm run check:integrations

      - name: Required maintenance evidence
        run: node tools/maintenance.mjs check

      - name: Backlog records and layout
        run: npm run check:backlog

      - name: Impact map page matches the rows
        run: node tools/impact-map.mjs && git diff --exit-code -- docs/agents/impact-map.md

      - name: Freshness and own template release (warnings only, never blocks)
        # The checkout is the template: check-harness compares this repository with its own release tags.
        env:
          HARNESS_HOME: ${{ github.workspace }}
        run: npm run check:freshness -- --github

      - name: Scope-aware audit evidence
        run: node tools/check-audits.mjs --github
