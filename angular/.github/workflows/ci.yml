name: CI

# Every pull request: the harness checks, lint, unit tests, type check, build; then the browser tests.
# tools/ci-status.mjs reads this workflow by its name (CI); keep it.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:freshness compares the backlog's commit with main and lists merged branches

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backlog records and layout
        run: npm run check:backlog

      - name: Harness template, for the release check below
        # check-harness compares this project with the template's release tags; the template is public, so no token.
        run: |
          repo=$(node -p "require('./.harness.json').template?.repo ?? ''")
          if [ -n "$repo" ]; then
            git clone --quiet "$repo" "$RUNNER_TEMP/project-harness" ||
              echo "::warning title=Harness template::Could not clone $repo: template release check skipped."
          fi

      - name: Backlog freshness and template release (warnings only, never blocks)
        env:
          HARNESS_HOME: ${{ runner.temp }}/project-harness
        run: npm run check:freshness -- --github

      - name: AGENTS conventions and unused exports
        run: npm run check:conventions

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx ng test --watch=false

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit --noUnusedLocals --noUnusedParameters

      - name: Build
        run: npm run build

  e2e:
    # harness: delete this job if the project has no Playwright suite.
    if: ${{ github.event_name == 'pull_request' || inputs.e2e == true }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test --workers=1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
